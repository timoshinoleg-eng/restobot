<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Склад — RestoBot Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h1>Склад</h1>
      <div style="display:flex;gap:8px">
        <button class="btn btn-danger" onclick="loadLowStock()">Низкий запас</button>
        <button class="btn btn-primary" onclick="openIngredientModal()">+ Ингредиент</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Название</th><th>Ед.</th><th>На складе</th><th>Резерв</th><th>Мин.</th><th></th></tr>
        </thead>
        <tbody id="inventoryTable"></tbody>
      </table>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/inventory.js"></script>
  <script>
    Auth.requireAuth();
    UI.injectLayout('inventory');
    loadInventory();
  </script>
</body>
</html>
