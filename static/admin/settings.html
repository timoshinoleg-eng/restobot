<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки — RestoBot Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main>
    <h1 style="margin-bottom:20px">Настройки ресторана</h1>
    <div class="card" style="max-width:480px;margin-bottom:24px">
      <h3 style="margin-bottom:16px">Основные</h3>
      <form id="settingsForm">
        <div class="form-group"><label>Название</label><input id="restName"></div>
        <div class="form-group"><label>Мин. сумма заказа</label><input id="minOrder" type="number" step="0.01"></div>
        <div class="form-group"><label>Радиус доставки (км)</label><input id="deliveryRadius" type="number" step="0.1"></div>
        <div class="form-group">
          <label>НДС в чеке ЮKassa</label>
          <select id="vatCode">
            <option value="1">20%</option>
            <option value="2">10%</option>
            <option value="3">0%</option>
            <option value="4">Без НДС</option>
            <option value="5">20/120</option>
            <option value="6">10/110</option>
          </select>
        </div>
        <div class="form-group"><label>Валюта</label><input id="currency" maxlength="8"></div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
      </form>
    </div>
    <div class="card">
      <h3 style="margin-bottom:16px">Часы работы</h3>
      <form id="hoursForm">
        <div id="hoursGrid"></div>
        <button type="submit" class="btn btn-primary" style="margin-top:12px">Сохранить часы</button>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/settings.js"></script>
  <script>
    Auth.requireAuth();
    UI.injectLayout('settings');
    initSettings();
  </script>
</body>
</html>
