version: "3.8"

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: restobot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: restobot
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restobot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Bot Service (Telegram) ───────────────────────────────────
  bot:
    build: .
    command: python -m bot.main
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=postgresql+asyncpg://restobot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/restobot
      - REDIS_URL=redis://redis:6379/0
      - YC_FOLDER_ID=${YC_FOLDER_ID}
      - YC_IAM_TOKEN=${YC_IAM_TOKEN}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── API Service ────────────────────────────────────────────────
  api:
    build: .
    command: python -m api.main
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://restobot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/restobot
      - REDIS_URL=redis://redis:6379/0
      - YC_FOLDER_ID=${YC_FOLDER_ID}
      - YC_IAM_TOKEN=${YC_IAM_TOKEN}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── AI Service ───────────────────────────────────────────────
  ai:
    build: .
    command: python -m ai.main
    environment:
      - DATABASE_URL=postgresql+asyncpg://restobot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/restobot
      - YC_FOLDER_ID=${YC_FOLDER_ID}
      - YC_IAM_TOKEN=${YC_IAM_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Payment Worker ──────────────────────────────────────────
  worker:
    build: .
    command: python -m payments.worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://restobot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/restobot
      - REDIS_URL=redis://redis:6379/0
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
