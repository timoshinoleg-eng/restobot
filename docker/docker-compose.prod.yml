name: restobot

services:
  caddy:
    image: caddy:2.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - restobot
    depends_on:
      - admin
      - public
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  admin:
    image: ${ADMIN_IMAGE}
    restart: unless-stopped
    environment:
      PORT: "8000"
      ENVIRONMENT: production
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET}
      YC_FOLDER_ID: ${YC_FOLDER_ID}
      YC_IAM_TOKEN: ${YC_IAM_TOKEN}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      YC_OBJECT_STORAGE_BUCKET: ${YC_OBJECT_STORAGE_BUCKET}
      YC_OBJECT_STORAGE_ENDPOINT: ${YC_OBJECT_STORAGE_ENDPOINT}
      ENABLE_BOOTSTRAP_API: ${ENABLE_BOOTSTRAP_API:-false}
      BOOTSTRAP_API_TOKEN: ${BOOTSTRAP_API_TOKEN:-}
    networks:
      - restobot
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  public:
    image: ${PUBLIC_IMAGE}
    restart: unless-stopped
    environment:
      PORT: "8001"
      ENVIRONMENT: production
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET}
      YC_FOLDER_ID: ${YC_FOLDER_ID}
      YC_IAM_TOKEN: ${YC_IAM_TOKEN}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      YC_OBJECT_STORAGE_BUCKET: ${YC_OBJECT_STORAGE_BUCKET}
      YC_OBJECT_STORAGE_ENDPOINT: ${YC_OBJECT_STORAGE_ENDPOINT}
    networks:
      - restobot
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  restobot:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
